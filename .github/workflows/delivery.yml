name: Delivery

# What moves a change along once it is pushed or merged: it opens the pull requests, builds and validates
# a release, creates the draft and, once the maintainer turns it on, publishes it. See "How a change ships"
# in CONTRIBUTING.md. Publishing stays off until the repository variable PUBLISHING_ENABLED is true.
on:
  push:
    branches:
      # Keep these in step with WORK_PREFIXES in scripts/lib/flow.mjs.
      - feature/**
      - feat/**
      - fix/**
      - chore/**
      - docs/**
      - refactor/**
      - test/**
      - ci/**
      - build/**
      - perf/**
      - develop
      - main
      - release/v*

# AUTOMATION_TOKEN does the writing, because a pull request opened with this workflow's own token leaves
# the Gate waiting for a click. The jobs that hold it run no npm, so nothing from a dependency runs next to it.
permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  # On a release branch, a newer merge makes validating the older one pointless.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  next:
    name: Next step
    # A fork has no AUTOMATION_TOKEN, and its author opens the pull request here by hand.
    if: github.repository == 'Weslley08/ulanzi-deck-soundpad-pro' && !github.event.deleted && !startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Without the secret, checkout would stop with its own message, and the next step names what to set.
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          # Only develop pushes anything with git: the bump/ branches.
          persist-credentials: ${{ github.ref_name == 'develop' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/flow.mjs next
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          # Off until the maintainer approves publishing: merging into main then leaves the draft alone.
          PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}

  build:
    name: Build
    # Creating a release branch from main is also a push, with nothing new to validate.
    if: github.repository == 'Weslley08/ulanzi-deck-soundpad-pro' && startsWith(github.ref, 'refs/heads/release/') && !github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: The branch must match every version in the repository
        run: node scripts/flow.mjs check-release
        env:
          BRANCH: ${{ github.ref_name }}
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit
      - run: npm run check:sdk
      - run: npm run check:licenses
      - run: npm run package
      - run: npm run verify:package
      - run: npm run check:secrets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: error

  smoke:
    name: Smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    # A hang must fail early instead of holding a runner for six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Soundpad runs on Windows only, so the very zip that goes in the draft starts there.
        os: [windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip
          path: dist
      - run: npm run verify:package

  measure:
    name: Measure
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run setup
      - shell: bash
        run: |
          mkdir measure
          npm run --silent measure | tee measure/measure.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure
          path: measure/measure.txt
          if-no-files-found: error

  draft:
    name: Draft and pull request to main
    needs: [smoke, measure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: measure
          path: measure
      - name: Create or update the draft, and open the pull request to main
        # A draft on purpose: a person tests it on a real deck before merging into main publishes it.
        run: |
          (cd dist && sha256sum ./*.zip > SHA256SUMS.txt)
          node scripts/flow.mjs draft-release
          node scripts/flow.mjs open-main-pull-request
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
