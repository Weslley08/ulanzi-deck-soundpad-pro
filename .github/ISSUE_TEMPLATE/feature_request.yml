name: Feature request
description: A new key, a setting or an idea.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?
      description: The plugin can only do what Soundpad's remote control offers. docs/SOUNDPAD-API.md lists it.
  - type: dropdown
    id: device
    attributes:
      label: Device you would use it on
      options:
        - D200
        - D200H
        - D200X
        - Any
