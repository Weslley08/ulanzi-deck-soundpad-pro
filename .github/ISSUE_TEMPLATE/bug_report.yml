name: Bug report
description: Something on the key or in the settings panel is not working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is a public page. Sound names and file paths in logs can say things about you, so check before pasting.
        For a security problem, use the [private report](https://github.com/Weslley08/ulanzi-deck-soundpad-pro/security/advisories/new) instead.
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - D200
        - D200H
        - D200X
        - Other
        - No device (simulator or tests)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: studio
    attributes:
      label: Ulanzi Studio version
      placeholder: "3.3.0"
    validations:
      required: true
  - type: input
    id: soundpad
    attributes:
      label: Soundpad version, and Steam or standalone
      description: Shown in the plugin's settings panel under Diagnostics.
      placeholder: "4.0.35, Steam"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Soundpad Controller version
      description: Shown at the bottom of the key's settings panel.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Which key
      options:
        - Favorite sound
        - Playback control
        - All, or not related to one
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A photo of the key and the Diagnostics part of the panel help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Put the action on a key
        2. Choose ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Start Studio with --log and paste the lines starting with [Soundpad Pro].
      render: text
