version: 2
updates:
  - package-ecosystem: npm
    directory: /com.ulanzi.soundpadpro.ulanziPlugin
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to the Node that Ulanzi Studio runs plugins on, 20.12.2.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
